{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Mis Proyectos</h1>

    </div>
    
    <div class="row">
        {% for project in data.projects %}
        <div class="col-lg-6 mb-5">
            <div class="card h-100 shadow-lg modern-card">
                <div class="card-img-top bg-dark text-light d-flex align-items-center justify-content-center" 
                     style="height: 250px; background: linear-gradient(135deg, #{{ ['667eea', 'f093fb', '4facfe', '43e97b'][loop.index0 % 4] }} 0%, #{{ ['764ba2', 'f5576c', '00f2fe', '38f9d7'][loop.index0 % 4] }} 100%);">
                    <i class="fas fa-{{ ['laptop-code', 'mobile-alt', 'database', 'server'][loop.index0 % 4] }} fa-4x"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <h3 class="card-title">{{ project.title }}</h3>
                    <p class="card-text flex-grow-1">{{ project.description }}</p>
                    
                    <div class="technologies mb-3">
                        <h6>Tecnologías utilizadas:</h6>
                        {% for tech in project.technologies %}
                        <span class="badge bg-secondary me-1 mb-1">{{ tech }}</span>
                        {% endfor %}
                    </div>
                    
                    <div class="project-links mt-auto">
                        <div class="d-grid gap-2 d-md-flex">
                            <a href="https://github.com/GabrielSilva-A/Porfolio-flask" class="btn btn-dark btn-lg me-2" target="_blank" rel="noopener">
                                <i class="fab fa-github me-2"></i>Ver Código
                            </a>
                            <a href="https://gabrielsilva-a.github.io/Porfolio-flask/" class="btn btn-primary btn-lg" target="_blank" rel="noopener">
                                <i class="fas fa-external-link-alt me-2"></i>Visitar Sitio
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
